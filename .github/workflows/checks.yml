name: Install and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MAGIC_NO_PAUSE: '1'
      QT_QPA_PLATFORM: ${{ matrix.os == 'windows-latest' && 'windows' || 'offscreen' }}
      QT_MEDIA_BACKEND: ffmpeg
      PYTHONUTF8: '1'
      MAGIC_RENDER_CHECK_DIR: render-checks
      RUN_UPDATE_HTTPS_TESTS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install macOS without system Python
        if: runner.os == 'macOS'
        run: zsh install.command
      - name: Install Windows without system Python
        if: runner.os == 'Windows'
        shell: cmd
        run: install.bat -Cpu
      - name: Validate macOS
        if: runner.os == 'macOS'
        run: |
          VENV_PYTHON="$HOME/.vocal-separator-and-speed-adj/.venv/bin/python"
          "$VENV_PYTHON" -m pip install -r requirements-dev.txt
          "$VENV_PYTHON" -m pip check
          "$VENV_PYTHON" -m ruff check .
          "$VENV_PYTHON" -m playwright install chromium webkit
          "$VENV_PYTHON" tools/build_web.py
          git diff --exit-code -- web_player/index.html web_player/sw.js
          RUN_WEB_TESTS=1 "$VENV_PYTHON" tools/run_tests.py
          "$VENV_PYTHON" tools/build_release.py
      - name: Validate Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VenvPython = "$env:LOCALAPPDATA\Magic-Instrumental\.venv\Scripts\python.exe"
          & $VenvPython -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $VenvPython -m pip check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $VenvPython -m ruff check .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $VenvPython tools/run_tests.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $VenvPython tools/build_release.py --check
          exit $LASTEXITCODE
      - name: Source archive
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Magic-Instrumental-source
          path: dist/
          if-no-files-found: error
      - name: GP numeric rendering proof
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gp-numeric-render-${{ matrix.os }}
          path: render-checks/
          if-no-files-found: warn
  release:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Package reviewed source
        run: python3 tools/build_release.py
      - name: Publish a new version after both platforms pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'from practice_player import __version__; print(__version__)')
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Version v$VERSION already exists; keeping its immutable release files."
            exit 0
          fi
          gh release create "v$VERSION" dist/*.zip dist/SHA256SUMS.txt dist/PUBLIC_FILES.json \
            --target "$GITHUB_SHA" --title "Magic-Instrumental v$VERSION" \
            --notes-file CHANGELOG.md
